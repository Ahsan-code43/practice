<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E‑Catalog Store</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="logo">E‑Catalog</div>
        <nav class="nav-menu">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
        <div class="search-bar">
            <input type="text" placeholder="Search products..." />
            <button>Search</button>
        </div>
        <div class="cart-icon">🛒</div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to E‑Catalog</h1>
        <p>Your one‑stop online shop for everything you need.</p>
        <button class="cta">Start Shopping</button>
    </section>

    <!-- Product Grid -->
    <section class="product-grid">
        <h2>Featured Products</h2>
        <div class="grid">
            <!-- Repeat product cards -->
            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product 1" />
                <h3>Product 1</h3>
                <p class="price">$19.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product 2" />
                <h3>Product 2</h3>
                <p class="price">$29.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product 3" />
                <h3>Product 3</h3>
                <p class="price">$39.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product 4" />
                <h3>Product 4</h3>
                <p class="price">$49.99</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 E‑Catalog. All rights reserved.</p>
    </footer>
</body>
</html>
