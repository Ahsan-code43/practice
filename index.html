<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Registrasi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 440px;
    }
    h2 {
      margin-bottom: 20px;
      color: #2d3748;
      text-align: center;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 16px;
      position: relative;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: #374151;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      color: #1f2937;
      transition: all 0.2s ease-in-out;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
    }
    input.is-invalid {
      border-color: #e53e3e !important;
      background-color: #fff5f5 !important;
    }
    input.is-valid {
      border-color: #38a169;
      background-color: #f0fff4;
    }
    .error-text {
      color: #e53e3e;
      font-size: 13px;
      font-weight: 600;
      margin-top: 6px;
      display: none;
    }
    .error-text::before {
      content: "⚠️ ";
    }
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .alert-error {
      background-color: #fed7d7;
      color: #9b2c2c;
      border: 1.5px solid #feb2b2;
    }
    .alert-success {
      background-color: #c6f6d5;
      color: #22543d;
      border: 1.5px solid #9ae6b4;
    }
    button {
      width: 100%;
      padding: 13px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 10px;
    }
    button:hover {
      background: #5a67d8;
    }
    button:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Registrasi Akun</h2>

    <!-- Banner Notifikasi -->
    <div id="globalAlert" class="alert"></div>

    <form id="registrationForm" novalidate autocomplete="off">
      <div class="form-group">
        <label for="name">Nama</label>
        <input type="text" id="name" placeholder="Masukkan nama Anda">
        <div id="nameError" class="error-text"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="contoh@domain.com">
        <div id="emailError" class="error-text"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimal 8 karakter">
        <div id="passwordError" class="error-text"></div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Konfirmasi Password</label>
        <input type="password" id="confirmPassword" placeholder="Ulangi password">
        <div id="confirmPasswordError" class="error-text"></div>
      </div>

      <button type="submit" id="submitBtn">Daftar Sekarang</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('registrationForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const globalAlert = document.getElementById('globalAlert');

    const nameError = document.getElementById('nameError');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const confirmPasswordError = document.getElementById('confirmPasswordError');

    // Validasi format email regex
    function isValidEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    function showFieldError(input, errorElement, message) {
      input.classList.remove('is-valid');
      input.classList.add('is-invalid');
      errorElement.textContent = message;
      errorElement.style.display = 'block';
    }

    function hideFieldError(input, errorElement) {
      input.classList.remove('is-invalid');
      if (input.value.trim() !== '') {
        input.classList.add('is-valid');
      } else {
        input.classList.remove('is-valid');
      }
      errorElement.textContent = '';
      errorElement.style.display = 'none';
    }

    // 1. Validasi Nama
    function validateName() {
      const val = nameInput.value.trim();
      if (!val) {
        showFieldError(nameInput, nameError, 'Wajib Diisi');
        return false;
      }
      hideFieldError(nameInput, nameError);
      return true;
    }

    // 2. Validasi Email
    function validateEmail() {
      const val = emailInput.value.trim();
      if (!val) {
        showFieldError(emailInput, emailError, 'Wajib Diisi');
        return false;
      }
      if (!isValidEmail(val)) {
        showFieldError(emailInput, emailError, 'Format E-mail Tidak Valid');
        return false;
      }
      hideFieldError(emailInput, emailError);
      return true;
    }

    // 3. Validasi Password
    function validatePassword() {
      const val = passwordInput.value;
      if (!val) {
        showFieldError(passwordInput, passwordError, 'Wajib Diisi');
        return false;
      }
      if (val.length < 8) {
        showFieldError(passwordInput, passwordError, 'Password min.8 karakter');
        return false;
      }
      hideFieldError(passwordInput, passwordError);

      // Revalidasi konfirmasi jika konfirmasi sudah terisi
      if (confirmPasswordInput.value.length > 0) {
        validateConfirmPassword();
      }
      return true;
    }

    // 4. Validasi Konfirmasi Password
    function validateConfirmPassword() {
      const passVal = passwordInput.value;
      const confirmVal = confirmPasswordInput.value;

      if (!confirmVal) {
        showFieldError(confirmPasswordInput, confirmPasswordError, 'Wajib Diisi');
        return false;
      }
      if (passVal !== confirmVal) {
        showFieldError(confirmPasswordInput, confirmPasswordError, 'Password Tidak Cocok');
        return false;
      }
      hideFieldError(confirmPasswordInput, confirmPasswordError);
      return true;
    }

    // Pasang listener real-time (saat mengetik dan saat klik keluar)
    nameInput.addEventListener('input', validateName);
    nameInput.addEventListener('blur', validateName);

    emailInput.addEventListener('input', validateEmail);
    emailInput.addEventListener('blur', validateEmail);

    passwordInput.addEventListener('input', validatePassword);
    passwordInput.addEventListener('blur', validatePassword);

    confirmPasswordInput.addEventListener('input', validateConfirmPassword);
    confirmPasswordInput.addEventListener('blur', validateConfirmPassword);

    // Event Submit Form
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      // Reset alert global
      globalAlert.style.display = 'none';
      globalAlert.className = 'alert';
      globalAlert.textContent = '';

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      // Syarat 1: Jika semua isian kosong
      if (!name && !email && !password && !confirmPassword) {
        showFieldError(nameInput, nameError, 'Wajib Diisi');
        showFieldError(emailInput, emailError, 'Wajib Diisi');
        showFieldError(passwordInput, passwordError, 'Wajib Diisi');
        showFieldError(confirmPasswordInput, confirmPasswordError, 'Wajib Diisi');

        globalAlert.textContent = 'Wajib Diisi';
        globalAlert.className = 'alert alert-error';
        globalAlert.style.display = 'block';
        return;
      }

      // Validasi setiap field
      const isNameValid = validateName();
      const isEmailValid = validateEmail();
      const isPasswordValid = validatePassword();
      const isConfirmValid = validateConfirmPassword();

      const isAllValid = isNameValid && isEmailValid && isPasswordValid && isConfirmValid;

      if (!isAllValid) {
        globalAlert.textContent = 'Silakan perbaiki kolom yang salah di bawah';
        globalAlert.className = 'alert alert-error';
        globalAlert.style.display = 'block';
        return;
      }

      // Syarat 5: Jika semua valid
      globalAlert.textContent = 'Registrasi Berhasil';
      globalAlert.className = 'alert alert-success';
      globalAlert.style.display = 'block';

      // Reset form dan status visual
      form.reset();
      [nameInput, emailInput, passwordInput, confirmPasswordInput].forEach(input => {
        input.classList.remove('is-valid', 'is-invalid');
      });
    });
  </script>
</body>
</html>
